name: CI

on:
  push:            # любая ветка: так видно состояние до мержа
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core + tests (no AutoCAD needed)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Build El.Core (netstandard2.0 + net45)
        run: dotnet build src/El.Core/El.Core.csproj -c Release --nologo

      - name: Tests — topology, AW33, diff, OMNI revision store, bounded operations
        run: dotnet run --project tests/El.Core.Tests -c Release --nologo

  plugin-2024:
    name: Plugin build (AutoCAD 2024 API from NuGet)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Build El.Plugin against AutoCAD.NET 24.3.0 (no AutoCAD install on the runner)
        run: dotnet build src/El.Plugin/El.Plugin.csproj -c Release --nologo -p:AcadLocal=false

      - name: Verify the command surface is actually inside the built assembly
        shell: pwsh
        run: |
          $dll = "src/El.Plugin/bin/Release/net48/El.Plugin.dll"
          if (!(Test-Path $dll)) { throw "El.Plugin.dll was not produced" }
          $size = (Get-Item $dll).Length
          if ($size -lt 50000) { throw "El.Plugin.dll looks truncated ($size bytes)" }
          $text = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes((Resolve-Path $dll)))
          $expected = @(
            'EL-TRACE','EL-CHECK','EL-REPORT','EL-PATH','EL-WHATIF','EL-LOOPS','EL-BOTTLENECK',
            'AW33','AW33-CSV','AW33-HTML','DrawWire','WireTable','WireNodes',
            'OMNI-SNAP','OMNI-HISTORY','OMNI-ARCHIVE','OMNI-RESTORE','OMNI-DIFF','OMNI-LOG',
            'OMNI-CLEAR','OMNI-TOGGLE','OMNI-NOTE'
          )
          $missing = @($expected | Where-Object { $text -notmatch [regex]::Escape($_) })
          if ($missing.Count -gt 0) { throw "commands missing from the DLL: $($missing -join ', ')" }
          Write-Host "all $($expected.Count) commands present in $size bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: El.Plugin.2024
          path: src/El.Plugin/bin/Release/net48/El.Plugin.dll

  plugin-2027:
    name: Plugin build (AutoCAD 2027 API, .NET 10)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build El.Plugin.2027 against AutoCAD.NET 26.0.0
        run: dotnet build src/El.Plugin.2027/El.Plugin.2027.csproj -c Release --nologo

      - name: Verify the command surface
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter El.Plugin.dll -Path src/El.Plugin.2027/bin/Release | Select-Object -First 1
          if (!$dll) { throw "El.Plugin.dll was not produced" }
          $text = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($dll.FullName))
          foreach ($c in @('OMNI-SNAP','OMNI-AUTOSNAP','OMNI-HISTORY','OMNI-RESTORE','EL-HOTSPOTS','EL-CROSSREF','AW33')) {
            if ($text -notmatch [regex]::Escape($c)) { throw "command $c missing" }
          }
          Write-Host "ok: $($dll.Length) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: El.Plugin.2027
          path: src/El.Plugin.2027/bin/Release/net10.0-windows/El.Plugin.dll

  setup-exe:
    name: Installer build (El.Tools.Setup.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Build the installer
        run: dotnet build src/Setup/Setup.csproj -c Release --nologo

      - name: Диагностика установщика (--version, --list-payloads)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/Setup/bin/Release/net48/El.Tools.Setup.exe").Path
          $ver = & $exe --version
          if ($ver -notmatch "Electrical Tools") { throw "--version ничего не вывел" }
          Write-Host $ver
          $list = & $exe --list-payloads
          if ($list -notmatch "R24.0" -or $list -notmatch "R26.0") { throw "--list-payloads без серий" }
          Write-Host $list

      - name: Silent install into a temp folder, check the bundle and uninstall
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "el-setup-check"
          $exe = (Resolve-Path "src/Setup/bin/Release/net48/El.Tools.Setup.exe").Path
          $install = Start-Process -FilePath $exe -ArgumentList @("--silent", "--target", $target) -Wait -PassThru -NoNewWindow
          if ($install.ExitCode -ne 0) { throw "installer exited with $($install.ExitCode)" }
          $manifests = Get-ChildItem -Recurse -Filter PackageContents.xml -Path $target
          if ($manifests.Count -lt 1) { throw "no bundle installed" }
          foreach ($m in $manifests) {
            $xml = [xml](Get-Content $m.FullName)
            if (!$xml.ApplicationPackage.Components.RuntimeRequirements.SeriesMin) { throw "no SeriesMin in $($m.FullName)" }
          }
          $remove = Start-Process -FilePath $exe -ArgumentList @("--silent", "--uninstall", "--target", $target) -Wait -PassThru -NoNewWindow
          if ($remove.ExitCode -ne 0) { throw "uninstall exited with $($remove.ExitCode)" }
          $left = Get-ChildItem -Recurse -File -Path $target -ErrorAction SilentlyContinue
          if ($left) { throw "files left after uninstall: $($left.Count)" }
          Write-Host "installer ok: $($manifests.Count) bundle(s), clean uninstall"

      - uses: actions/upload-artifact@v4
        with:
          name: El.Tools.Setup
          path: src/Setup/bin/Release/net48/El.Tools.Setup.exe
